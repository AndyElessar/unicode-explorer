name: Build, test, and deploy

on:
  push:
    branches: [main]
  # Pull requests (including Dependabot's) are built and tested, but not deployed
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; deployments on main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the exact SDK pinned in global.json (prerelease versions are never rolled forward)
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Needed because the app disables WASM exception handling, which relinks the native runtime
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Generate Unicode data
        working-directory: tools
        run: dotnet run UcdBuilder.cs

      - name: Publish
        run: dotnet publish src/UnicodeExplorer -c Release -o publish

      - name: Build tests
        run: dotnet build

      # Chromium for most E2E tests; Microsoft Edge for InterpreterModeTests (Edge's WebAssembly
      # interpreter). Edge is usually preinstalled on GitHub's Ubuntu runners.
      - name: Install Playwright browsers
        run: |
          pwsh tests/UnicodeExplorer.E2E/bin/Debug/net11.0/playwright.ps1 install --with-deps chromium
          command -v microsoft-edge-stable || pwsh tests/UnicodeExplorer.E2E/bin/Debug/net11.0/playwright.ps1 install msedge

      # Unit tests and end-to-end tests. The E2E tests serve the publish output above under
      # /unicode-explorer/ (before the GitHub Pages rewrite below), so they test what gets deployed.
      - name: Test
        run: dotnet test --no-build
        env:
          E2E_SITE_DIR: ${{ github.workspace }}/publish/wwwroot

      # Pages deployed from GitHub Actions are not processed by Jekyll, so no .nojekyll file is needed
      - name: Prepare for GitHub Pages
        if: github.event_name != 'pull_request'
        working-directory: publish/wwwroot
        run: |
          # The site is served from https://<user>.github.io/unicode-explorer/
          sed -i 's|<base href="/" />|<base href="/unicode-explorer/" />|' index.html
          grep -q '<base href="/unicode-explorer/" />' index.html
          # Let the Blazor router handle deep links such as /char/1F600
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: publish/wwwroot

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
