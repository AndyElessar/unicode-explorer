<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and search Unicode characters in your browser." />
    <title>Unicode Explorer</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- icon-192.png is rendered from icon.svg, for browsers without SVG favicons (e.g. Safari) -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/interop.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
        <!-- Shown only in Edge's enhanced security mode (see interop.js); keep in sync with MainLayout -->
        <p class="edge-security-note loading-note">
            Microsoft Edge's enhanced security mode makes this site load slowly.
            To speed it up, trust this site: select the lock icon in the address bar,
            then turn off "Use enhanced security for this site".
        </p>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
